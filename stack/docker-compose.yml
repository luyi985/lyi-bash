version: '3.8'

services:
  postgresql:
    image: postgres:latest
    container_name: postgresql_db
    env_file:
      - ./env
    environment:
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresql_data:
    driver: local
