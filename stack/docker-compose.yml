services:
  postgresql:
    image: postgres:latest
    container_name: postgresql_db
    env_file:
      - ./env
    environment:
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      # PostgreSQL 18+ expects data at /var/lib/postgresql (with version subdirectories)
      # instead of /var/lib/postgresql/data for pg_upgrade compatibility
      - postgresql_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresql_data:
    driver: local
